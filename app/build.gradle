plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.bluew9.camera'
  compileSdk 34
  defaultConfig { applicationId 'com.bluew9.camera'; minSdk 26; targetSdk 34; versionCode 2; versionName '1.2'
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
  signingConfigs { release {
    if (System.getenv('KS_PATH')) { storeFile file(System.getenv('KS_PATH'))
      storePassword System.getenv('STORE_PASS'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASS') } } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  androidResources { noCompress 'tflite' }
  dependenciesInfo { includeInApk = false; includeInBundle = false }
}
dependencies {
  def v = '1.3.4'
  implementation "androidx.camera:camera-core:$v"
  implementation "androidx.camera:camera-camera2:$v"
  implementation "androidx.camera:camera-lifecycle:$v"
  implementation "androidx.camera:camera-video:$v"
  implementation "androidx.camera:camera-view:$v"
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
  // On-device person segmentation for the background tool. Model file is bundled in assets/, no network.
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
