name: build
on: { push: { tags: ['v*'] }, workflow_dispatch: {} }
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: echo "${{ secrets.KS_B64 }}" | base64 -d > $RUNNER_TEMP/k.jks
      - run: gradle assembleRelease --no-daemon
        env:
          KS_PATH: ${{ runner.temp }}/k.jks
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: app/build/outputs/apk/release/*.apk }

      - name: Rename APK and write checksum
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" Camera.apk
          sha256sum Camera.apk | tee Camera.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Camera.apk
            Camera.apk.sha256
